name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Version = tag (verification, aucune modification)
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag non SemVer: $GITHUB_REF_NAME"; exit 1; }
          PKG=$(node -p "require('./package.json').version")
          [ "$PKG" = "$VERSION" ] || { echo "package.json ($PKG) != tag ($VERSION)"; exit 1; }
          LOCK=$(node -p "const l=require('./package-lock.json'); [l.version, (l.packages||{})[''] && l.packages[''].version].join(' ')")
          [ "$LOCK" = "$VERSION $VERSION" ] || { echo "package-lock.json ($LOCK) != tag ($VERSION)"; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - run: scripts/ci.sh

      - name: Livrable
        env:
          V: ${{ steps.version.outputs.value }}
        run: |
          tar -czf "inscriptions-club-$V.tar.gz" dist Dockerfile docker-compose.prod.yml package.json package-lock.json
          sha256sum "inscriptions-club-$V.tar.gz" > "inscriptions-club-$V.tar.gz.sha256"

      - name: Notes de release (section CHANGELOG.md de la version)
        env:
          V: ${{ steps.version.outputs.value }}
        run: |
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$V" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v || $2 == "v" v) { found=1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ -s release-notes.md ]; then
            echo "NOTES_MODE=file" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune section $V dans CHANGELOG.md — notes generees par GitHub"
            echo "NOTES_MODE=generate" >> "$GITHUB_ENV"
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.value }}
        run: |
          if [ "$NOTES_MODE" = "file" ]; then NOTES=(--notes-file release-notes.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "inscriptions-club-$V.tar.gz" "inscriptions-club-$V.tar.gz.sha256" \
            --verify-tag --title "v$V" "${NOTES[@]}"
