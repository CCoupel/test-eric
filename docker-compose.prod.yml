# PROD — application + PostgreSQL, image construite localement (sans registre).
# Utilise depuis le dossier d extraction du livrable inscriptions-club-<X.Y.Z>.tar.gz (release.yml),
# avec docker compose ou podman-compose (voir scripts/container-env.sh et
# .claude/agents/environments/deploy.prod.template.md — compagnon a ecrire avant le 1er PROD).
#
# Variables : fichier `.env` a cote de ce compose (genere au DEPLOY depuis .env +
# .claude/agents/environments/prod.env, DATABASE_URL derivee de POSTGRES_*) et `db.env`
# (POSTGRES_* seuls, pour le conteneur db). Les secrets
# passent UNIQUEMENT par env_file (--env-file : seul le chemin apparait dans la sortie de
# podman-compose) — jamais par `environment:`, dont les valeurs sont affichees en clair.
# Images en nom complet (docker.io/...) : podman refuse les noms courts sans registre de recherche.
name: inscriptions-club-prod

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - db.env        # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD uniquement (genere au DEPLOY)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/inscriptions-club:${APP_VERSION:-prod}
    restart: unless-stopped
    # Arret : laisse 60 s pour terminer un envoi d'e-mails en cours (SIGTERM puis SIGKILL).
    # docker compose l'applique nativement. podman-compose 1.0.6 seulement a down/stop/restart :
    # creer `app` via compose_up_app (scripts/container-env.sh), qui ajoute --stop-timeout de cette
    # valeur a la creation (StopTimeout=60, aussi pour un `podman stop` direct).
    stop_grace_period: 60s
    depends_on:
      - db
    env_file:
      - .env          # APP_BASE_URL, DATABASE_URL, SESSION_SECRET, ADMIN_*, TRUST_PROXY, SMTP_*, ...
    environment:      # valeurs non secretes uniquement
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${APP_PORT}/health\" || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
