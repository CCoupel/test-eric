# Base PostgreSQL ephemere pour les tests (local et CI — meme chemin, C11).
# Demarree/arretee par scripts/ci.sh quand DATABASE_URL est vide (docker ou podman,
# voir scripts/container-env.sh) :
#   DATABASE_URL=postgres://club:club@localhost:5433/club_test
# Identifiants de TEST uniquement (aucune donnee reelle, base en tmpfs) — jamais reutilises en QUALIF/PROD.
# Images en nom complet (docker.io/...) : podman refuse les noms courts sans registre de recherche.
name: inscriptions-club-test

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: club_test
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_test"]
      interval: 2s
      timeout: 3s
      retries: 30
