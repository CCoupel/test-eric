# Base PostgreSQL ephemere pour les tests d'integration (local et CI — meme chemin, C11).
# Demarree/arretee par scripts/ci.sh quand DATABASE_URL est vide :
#   docker compose -f docker-compose.test.yml up -d --wait db
#   DATABASE_URL=postgres://club:club@localhost:5433/club_test
# Identifiants de TEST uniquement (aucune donnee reelle, base en tmpfs) — jamais reutilises en QUALIF/PROD.
name: inscriptions-club-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: club_test
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_test"]
      interval: 2s
      timeout: 3s
      retries: 30
