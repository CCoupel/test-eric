# QUALIF — application + PostgreSQL, image construite localement (sans registre).
# Utilise depuis le dossier de deploiement build/qualif_v<X.Y.Z>/deploy/ (artefact extrait),
# avec docker compose ou podman-compose (voir scripts/container-env.sh et
# .claude/agents/environments/deploy.qualif.md).
#
# Variables : fichier `.env` a cote de ce compose (genere au DEPLOY depuis .env +
# .claude/agents/environments/qualif.env, DATABASE_URL derivee de POSTGRES_*) et `db.env`
# (POSTGRES_* seuls, pour le conteneur db). Les secrets
# passent UNIQUEMENT par env_file (--env-file : seul le chemin apparait dans la sortie de
# podman-compose) — jamais par `environment:`, dont les valeurs sont affichees en clair.
# Images en nom complet (docker.io/...) : podman refuse les noms courts sans registre de recherche.
name: inscriptions-club-qualif

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file:
      - db.env        # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD uniquement (genere au DEPLOY)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/inscriptions-club:${APP_VERSION:-qualif}
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:      # valeurs non secretes uniquement
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${APP_PORT}/health\" || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
